name: deploy

on:
  push:
    branches: [master]

permissions: {}

# デプロイは直列化し、後続のデプロイをキャンセルしない。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # seminar上のセルフホストランナーで実行し、
    # ステージングのディレクトリへrsyncして、
    # 書き終えた印をtouchする。
    # 印を見たホストのサービスが、
    # シンボリックリンクなどを捨てて配信ディレクトリへ写す。
    # ランナー定義はdotfilesのnixos/host/seminar/github-runner/に、
    # 同期の定義はnixos/host/seminar/cdn.nixにある。
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read # リポジトリコンテンツの読み取り
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # git lfsがマシンに存在しているだけだと`git lfs pull`がスキップされるためセットアップを実行。
      - run: git lfs install
      # checkoutの`lfs: true`はworktree展開前に`git lfs fetch`を実行するため、
      # `.lfsconfig`のForgejo向けURLが読まれずGitHubのLFSエンドポイントに向かって404になる。
      # checkout後に手動でpullすれば`.lfsconfig`が有効になる。
      - run: git lfs pull
      # パーミッションの正規化はホストの同期が行う。
      - run: rsync --checksum --recursive --delete public/ /mnt/noa/cdn.ncaq.net-deploy/public/
      - run: touch /mnt/noa/cdn.ncaq.net-deploy/deployed
